<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- 留出约 10% 边距 -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- 画板卡片 -->
  <rect x="30" y="34" width="56" height="62" rx="8" fill="#FFFFFF" fill-opacity="0.96"/>
  <!-- 标题条（可拖动示意） -->
  <rect x="38" y="44" width="34" height="8" rx="4" fill="#1E293B"/>
  <rect x="38" y="57" width="24" height="5" rx="2.5" fill="#94A3B8"/>
  <!-- 倾斜图案与旋转选框 -->
  <g transform="translate(68 74) rotate(-12)">
    <rect x="-15" y="-13" width="30" height="26" rx="5" fill="url(#accent)"/>
    <rect x="-18" y="-16" width="36" height="32" rx="2" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="-18" cy="-16" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="18" cy="-16" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="-18" cy="16" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="0" y1="-16" x2="0" y2="-25" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="-26" r="3.5" fill="#38BDF8"/>
  </g>
</svg>
