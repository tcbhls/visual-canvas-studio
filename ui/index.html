<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可视化画布编辑 — Visual Canvas Studio</title>
  <style>/*__INLINE_CSS__*/</style>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 纯净预览外壳（正常点击对话/文件树中的文件时默认呈现，极简无打扰） -->
    <div id="preview-shell" class="preview-shell hidden">
      <header class="preview-header">
        <div class="preview-header-left">
          <span id="preview-title" class="preview-title">预览</span>
          <span id="preview-meta" class="preview-meta"></span>
        </div>
        <div class="preview-header-right">
          <div id="preview-more-wrap" class="preview-more-wrap">
            <button id="btn-preview-more" class="preview-dots-btn" title="更多操作" aria-label="更多操作">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <circle cx="10" cy="4.5" r="1.35"/>
                <circle cx="10" cy="10" r="1.35"/>
                <circle cx="10" cy="15.5" r="1.35"/>
              </svg>
            </button>
            <div id="preview-menu" class="preview-menu hidden" role="menu">
              <button id="menu-enter-edit" class="preview-menu-item preview-menu-primary" role="menuitem">
                <span class="pm-ico">
                  <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 3 2.5 7 10 11l7.5-4L10 3Z"/>
                    <path d="M2.5 10.5 10 14.5l7.5-4"/>
                    <path d="M2.5 14 10 18l7.5-4"/>
                  </svg>
                </span>
                <span class="pm-body">
                  <span class="pm-title">可视化画布编辑</span>
                  <span id="menu-edit-sub" class="pm-sub">拆层 · 摆正 · 换色</span>
                </span>
              </button>
              <div id="menu-md-images" class="preview-menu-sublist hidden"></div>
              <div class="preview-menu-sep"></div>
              <button id="menu-view-source" class="preview-menu-item hidden" role="menuitem">
                <span class="pm-ico">
                  <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 6 3 10l4 4M13 6l4 4-4 4M11 4l-2 12"/>
                  </svg>
                </span>
                <span class="pm-title">查看 / 编辑源码</span>
              </button>
              <button id="menu-copy-content" class="preview-menu-item" role="menuitem">
                <span class="pm-ico">
                  <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="7" y="7" width="9.5" height="9.5" rx="2"/>
                    <path d="M13 7V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v6.5A1.5 1.5 0 0 0 5 13h2"/>
                  </svg>
                </span>
                <span class="pm-title">复制内容</span>
              </button>
              <button id="menu-copy-path" class="preview-menu-item" role="menuitem">
                <span class="pm-ico">
                  <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8.5 11.5 11.5 8.5M7 13a3 3 0 0 1 0-4.24l1.76-1.76a3 3 0 0 1 4.24 0M13 7a3 3 0 0 1 0 4.24L11.24 13a3 3 0 0 1-4.24 0"/>
                  </svg>
                </span>
                <span class="pm-title">复制路径</span>
              </button>
              <button id="menu-export-img" class="preview-menu-item hidden" role="menuitem">
                <span class="pm-ico">
                  <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 3.5v9m0 0-3-3m3 3 3-3M4 14.5v1A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-1"/>
                  </svg>
                </span>
                <span class="pm-title">导出高清图片</span>
              </button>
              <button id="menu-reveal-file" class="preview-menu-item" role="menuitem">
                <span class="pm-ico">
                  <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6a1.5 1.5 0 0 1 1.5-1.5h3.6l1.5 1.7H15.5A1.5 1.5 0 0 1 17 7.7v6.8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5V6Z"/>
                  </svg>
                </span>
                <span class="pm-title">在文件资源管理器中显示</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <div id="preview-body" class="preview-body">
        <!-- 1. 纯净图片 / SVG / 画布成品预览（支持原生式拖拽圈选区域进行评论） -->
        <div id="preview-image-view" class="preview-image-view hidden">
          <div id="preview-img-hint" class="preview-comment-hint">拖拽图片局部区域即可添加评论</div>
          <div id="preview-img-canvas" class="preview-img-canvas">
            <div id="preview-img-stage" class="preview-annot-stage">
              <img id="preview-img-el" class="preview-img-el" alt="" draggable="false" />
              <div id="preview-img-annot" class="preview-annot-layer"></div>
            </div>
          </div>
          <div id="preview-img-bar" class="preview-float-bar">
            <button id="btn-pimg-out" class="pfloat-btn" title="缩小">−</button>
            <button id="btn-pimg-fit" class="pfloat-val" title="适应窗口">100%</button>
            <button id="btn-pimg-in" class="pfloat-btn" title="放大">+</button>
            <span id="lbl-pimg-dim" class="pfloat-dim"></span>
            <span id="pimg-comment-group" class="pfloat-comment-group hidden">
              <span class="pfloat-sep"></span>
              <span id="lbl-pimg-comments" class="pfloat-comment-count">0 条评论</span>
              <button id="btn-pimg-send-comments" class="pfloat-send-btn" title="将全部圈选评论与标注图发给对话中的 AI">发送给 AI</button>
              <button id="btn-pimg-clear-comments" class="pfloat-btn" title="清空全部圈选评论">×</button>
            </span>
          </div>
        </div>

        <!-- 2. 纯净多页 PDF 阅读预览（同样支持拖拽页面局部区域添加评论） -->
        <div id="preview-pdf-view" class="preview-pdf-view hidden">
          <div id="preview-pdf-hint" class="preview-comment-hint">拖拽页面局部区域即可添加评论</div>
          <div id="preview-pdf-scroll" class="preview-pdf-scroll">
            <div id="preview-pdf-stage" class="preview-annot-stage">
              <img id="preview-pdf-img" class="preview-pdf-img" alt="PDF 页面预览" draggable="false" />
              <div id="preview-pdf-annot" class="preview-annot-layer"></div>
            </div>
          </div>
          <div id="preview-pdf-bar" class="preview-float-bar">
            <button id="btn-ppdf-prev" class="pfloat-btn" title="上一页">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
            </button>
            <span class="pfloat-page">
              <input id="inp-ppdf-page" type="number" min="1" value="1" class="pfloat-page-inp" /> / <span id="lbl-ppdf-total">1</span>
            </span>
            <button id="btn-ppdf-next" class="pfloat-btn" title="下一页">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            </button>
            <span class="pfloat-sep"></span>
            <button id="btn-ppdf-out" class="pfloat-btn" title="缩小">−</button>
            <button id="btn-ppdf-fit" class="pfloat-val" title="适应宽度">100%</button>
            <button id="btn-ppdf-in" class="pfloat-btn" title="放大">+</button>
            <span id="ppdf-comment-group" class="pfloat-comment-group hidden">
              <span class="pfloat-sep"></span>
              <span id="lbl-ppdf-comments" class="pfloat-comment-count">0 条评论</span>
              <button id="btn-ppdf-send-comments" class="pfloat-send-btn" title="将全部圈选评论与标注图发给对话中的 AI">发送给 AI</button>
              <button id="btn-ppdf-clear-comments" class="pfloat-btn" title="清空全部圈选评论">×</button>
            </span>
          </div>
        </div>

        <!-- 3. 纯净 Markdown 排版预览 -->
        <div id="preview-md-view" class="preview-md-view hidden">
          <article id="preview-md-article" class="preview-md-article"></article>
        </div>

        <!-- 4. 纯净 HTML 渲染预览 -->
        <div id="preview-html-view" class="preview-html-view hidden">
          <div id="preview-html-host" class="preview-html-host"></div>
        </div>

        <!-- 圈选区域评论极简浮动输入卡片 -->
        <div id="preview-comment-popover" class="pcomment-popover hidden" role="dialog" aria-label="区域评论">
          <div class="pcomment-head">
            <span id="pcomment-title" class="pcomment-title">区域 #1</span>
            <button id="btn-pcomment-close" class="pcomment-close" title="关闭 (Esc)">×</button>
          </div>
          <textarea id="inp-pcomment-text" class="pcomment-input" rows="2" placeholder="输入对该区域的批注或修改要求…"></textarea>
          <div class="pcomment-foot">
            <button id="btn-pcomment-delete" class="pcomment-del-btn hidden">删除</button>
            <span class="pcomment-foot-spacer"></span>
            <button id="btn-pcomment-save" class="pcomment-sec-btn" title="Enter">添加评论</button>
            <button id="btn-pcomment-send" class="pcomment-pri-btn" title="Ctrl+Enter">发给 AI</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 源码查看与编辑视图 -->
    <div id="source-shell" class="source-shell hidden">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-source-back" class="ghost-btn">← 返回预览</button>
          <span id="source-file-name" class="file-name">源码</span>
          <span id="source-dirty-dot" class="dirty-dot hidden">●</span>
        </div>
        <div class="topbar-right">
          <button id="btn-source-save" class="btn btn-primary">保存</button>
        </div>
      </header>
      <textarea id="source-textarea" class="source-textarea" spellcheck="false"></textarea>
    </div>

    <!-- 单行极简顶部栏（编辑模式） -->
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <button id="btn-back-preview" class="ghost-btn hidden" title="返回纯净预览模式">← 返回预览</button>
        <button id="btn-files-tab" class="icon-btn" title="切换文件列表">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6a1.5 1.5 0 0 1 1.5-1.5h3.5l1.5 1.7H15.5A1.5 1.5 0 0 1 17 7.7v6.8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5V6Z"/>
          </svg>
        </button>
        <div class="file-meta" title="点击浏览工作区文件">
          <span id="file-name" class="file-name">未打开文件</span>
          <span id="dirty-dot" class="dirty-dot hidden" title="有未保存更改">●</span>
          <span id="mode-pill" class="mode-pill hidden">画布</span>
        </div>
        <button id="btn-reveal-file" class="icon-btn" title="在资源管理器中打开文件所在位置" disabled>
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.5 3.5h5v5M16.5 3.5l-7 7M14.5 11.5v3.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5h3.5"/>
          </svg>
        </button>
      </div>

      <div class="topbar-center">
        <div class="seg-group">
          <button id="btn-undo" class="icon-btn" title="撤销 (Ctrl+Z)" disabled>
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 8.5h7a3.5 3.5 0 1 1 0 7H9M5 8.5l2.8-2.8M5 8.5l2.8 2.8"/>
            </svg>
          </button>
          <button id="btn-redo" class="icon-btn" title="重做 (Ctrl+Y)" disabled>
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 8.5H8a3.5 3.5 0 1 0 0 7h3M15 8.5l-2.8-2.8M15 8.5l-2.8 2.8"/>
            </svg>
          </button>
        </div>
        <div class="divider-v"></div>
        <div class="seg-group">
          <button id="btn-zoom-out" class="icon-btn" title="缩小">−</button>
          <button id="btn-zoom-fit" class="zoom-pill" title="适应画布">100%</button>
          <button id="btn-zoom-in" class="icon-btn" title="放大">+</button>
        </div>
      </div>

      <div class="topbar-right">
        <button id="btn-export" class="ghost-btn" title="导出高清 PNG/JPG 图片" disabled>导出</button>
        <button id="btn-sync-ai" class="ghost-btn hidden" title="把手动微调结果同步回对话中的 AI">同步</button>
        <button id="btn-save" class="btn btn-primary" title="保存回源文件 (Ctrl+S)" disabled>保存</button>
        <button id="btn-toggle-inspector" class="icon-btn active" title="展开/收起属性面板">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2"/>
            <line x1="12.5" y1="3.5" x2="12.5" y2="16.5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 本会话文件轻量切换条（仅独立侧栏模式展示，直开单文件标签时自动隐藏保持极简） -->
    <div id="conv-bar" class="conv-bar hidden">
      <span class="conv-bar-label">会话</span>
      <div id="conv-chips" class="conv-chips"></div>
      <button id="btn-conv-refresh" class="icon-btn icon-btn-xs" title="重新扫描本会话文件">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M16 10a6 6 0 1 1-1.7-4.2M16 4v3.2h-3.2"/>
        </svg>
      </button>
    </div>

    <!-- Markdown 文档内嵌图切换条（仅从 .md 预览切入编辑文档图片时显示） -->
    <div id="md-img-strip" class="conv-bar hidden">
      <span class="conv-bar-label">文档内图</span>
      <div id="md-img-chips" class="conv-chips"></div>
    </div>

    <!-- 主工作区 -->
    <div class="workspace-body">
      <!-- 左侧极简线性图标工具栏 -->
      <aside id="tool-rail" class="tool-rail hidden">
        <button class="rail-btn" data-add="title" title="主标题文字">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 5h11M10 5v10.5M7.5 15.5h5"/></svg>
        </button>
        <button class="rail-btn" data-add="subtitle" title="正文文案">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h12M4 10h9M4 14h11"/></svg>
        </button>
        <button class="rail-btn" data-add="badge" title="圆角标签 / 贴纸">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="6.5" width="14" height="7" rx="3.5"/><path d="M7.5 10h5"/></svg>
        </button>
        <div class="rail-sep"></div>
        <button class="rail-btn" data-add="rect" title="矩形">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="13" height="11" rx="2"/></svg>
        </button>
        <button class="rail-btn" data-add="circle" title="圆形">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.2"/></svg>
        </button>
        <button class="rail-btn" data-add="line" title="线条">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 15.5 16 4.5"/></svg>
        </button>
        <button class="rail-btn" data-add="mask" title="白色遮盖（橡皮擦）">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 15.5 8-8a1.8 1.8 0 0 0 0-2.5l-1.8-1.8a1.8 1.8 0 0 0-2.5 0l-7.2 7.2a1.8 1.8 0 0 0 0 2.5l2.5 2.6h8.5"/></svg>
        </button>
        <div class="rail-sep"></div>
        <button class="rail-btn" data-add="image" title="插入本地图片">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8.2" r="1.2"/><path d="m4.5 14.5 3.8-3.8 2.6 2.6 2.1-2.1 2.5 3.3"/></svg>
        </button>
      </aside>

      <!-- 中间画布舞台容器（含上下悬浮玻璃胶囊，彻底告别多层堆叠工具栏） -->
      <div class="stage-shell">
        <!-- 选中元素时悬浮于画布顶部的极简快捷微调胶囊 -->
        <div id="quick-bar" class="float-pill float-pill-top hidden">
          <div class="quick-group">
            <button class="pill-btn pill-icon-btn" data-align="center-h" title="水平居中">
              <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="9" y1="2.5" x2="9" y2="15.5"/><rect x="4.5" y="6" width="9" height="6" rx="1.2"/></svg>
            </button>
            <button class="pill-btn pill-icon-btn" data-align="center-v" title="垂直居中">
              <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="9" x2="15.5" y2="9"/><rect x="6" y="4.5" width="6" height="9" rx="1.2"/></svg>
            </button>
          </div>
          <div class="pill-sep"></div>
          <div class="quick-group">
            <button class="pill-btn" data-rot="-5" title="逆时针 5°">-5°</button>
            <button class="pill-btn pill-btn-active" data-rot="reset" title="一键摆正 0°">摆正</button>
            <button class="pill-btn" data-rot="5" title="顺时针 5°">+5°</button>
            <span id="quick-angle" class="angle-chip">0°</span>
          </div>
          <div class="pill-sep"></div>
          <div class="quick-group">
            <button id="btn-pdf-edit-line" class="pill-btn pill-btn-strong hidden" title="双击或点此原位改字">编辑文字</button>
            <button id="btn-pdf-revert-line" class="pill-btn hidden" title="撤销改动还原原貌">还原</button>
            <button class="pill-btn pill-icon-btn" data-layer="up" title="上移一层">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5"/></svg>
            </button>
            <button class="pill-btn pill-icon-btn" data-layer="down" title="下移一层">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 4v8M4.5 8.5 8 12l3.5-3.5"/></svg>
            </button>
            <button class="pill-btn pill-icon-btn" data-layer="dup" title="复制 (Ctrl+D)">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
            </button>
            <button class="pill-btn pill-icon-btn pill-btn-danger" data-layer="del" title="删除 (Delete)">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M6.2 4.5V3.2h3.6v1.3M5 4.5l.6 8.3h4.8l.6-8.3"/></svg>
            </button>
          </div>
          <div id="dom-breadcrumb" class="dom-breadcrumb hidden"></div>
        </div>

        <!-- 中间画布滚动视口 -->
        <main id="stage-viewport" class="stage-viewport">
          <!-- 空状态 / 快速开始 -->
          <section id="welcome-view" class="welcome-view">
            <div class="welcome-card">
              <h2>Visual Canvas Studio</h2>
              <p class="muted">打开任意图片、PDF、Markdown、HTML、SVG 或分层画布，直接拖拽排版、智能拆层、底图换色与矢量写回。</p>
              <div class="path-bar" style="margin-bottom:14px;">
                <input id="inp-welcome-path" type="text" class="path-input" placeholder="粘贴本地文件路径或目录并回车..." />
                <button id="btn-welcome-open" class="btn btn-primary">打开</button>
              </div>
              <div class="welcome-actions">
                <button class="btn btn-secondary" data-new-preset="800x800">800×800 主图</button>
                <button class="btn btn-secondary" data-new-preset="900x1200">3:4 竖图</button>
                <button class="btn btn-secondary" data-new-preset="750x1200">详情页</button>
              </div>
              <div id="welcome-file-list" class="welcome-file-list"></div>
            </div>
          </section>

          <!-- 引擎 A: Fabric.js 分层画布容器 -->
          <div id="fabric-stage-wrap" class="stage-wrap hidden">
            <div id="fabric-artboard-frame" class="artboard-frame">
              <canvas id="fabric-canvas"></canvas>
            </div>
          </div>

          <!-- 引擎 B: HTML / SVG 鼠标直编容器 -->
          <div id="dom-stage-wrap" class="stage-wrap hidden">
            <div id="dom-artboard-frame" class="artboard-frame dom-artboard-frame">
              <div id="dom-host" class="dom-host"></div>
              <div id="dom-overlay" class="dom-overlay">
                <div id="dom-guide-v" class="snap-guide snap-guide-v hidden"></div>
                <div id="dom-guide-h" class="snap-guide snap-guide-h hidden"></div>
                <div id="dom-hover-box" class="dom-hover-box hidden">
                  <span id="dom-hover-tag" class="dom-tag"></span>
                </div>
                <div id="dom-select-box" class="dom-select-box hidden">
                  <div class="gizmo-rot-stem"></div>
                  <div class="gizmo-handle gizmo-rot" data-handle="rot" title="拖拽旋转">↻</div>
                  <div class="gizmo-handle gizmo-nw" data-handle="nw"></div>
                  <div class="gizmo-handle gizmo-n" data-handle="n"></div>
                  <div class="gizmo-handle gizmo-ne" data-handle="ne"></div>
                  <div class="gizmo-handle gizmo-e" data-handle="e"></div>
                  <div class="gizmo-handle gizmo-se" data-handle="se"></div>
                  <div class="gizmo-handle gizmo-s" data-handle="s"></div>
                  <div class="gizmo-handle gizmo-sw" data-handle="sw"></div>
                  <div class="gizmo-handle gizmo-w" data-handle="w"></div>
                </div>
              </div>
            </div>
          </div>

          <div id="live-hud" class="live-hud hidden"></div>
        </main>

        <!-- 平面图拆层悬浮胶囊（停靠画布底部，干净不占顶栏） -->
        <div id="img-bar" class="float-pill float-pill-bottom hidden">
          <button id="btn-img-split-all" class="pill-btn pill-btn-strong" title="一键拆出图中所有前景元素并自动无痕修补背景">全图拆层</button>
          <span id="lbl-img-el-count" class="pill-meta">0 项</span>
          <div class="pill-sep"></div>
          <button id="btn-img-pick" class="pill-btn pill-btn-active" title="开启后悬停高亮、单击直接提层">点选拆层</button>
          <button id="btn-img-box" class="pill-btn" title="拖框圈出局部区域抠离">框选抠图</button>
          <select id="sel-img-seg-mode" class="pill-select" title="识别粒度">
            <option value="smart" selected>智能</option>
            <option value="fine">精细</option>
          </select>
          <div class="pill-sep"></div>
          <button id="btn-img-bg-lock" class="pill-btn" title="锁定/解锁底层背景图，解锁后可直接选中底图换色或移动">锁定底图</button>
          <button id="btn-img-save-canvas" class="pill-btn" title="另存为分层工程 .canvas.json">存为分层</button>
        </div>

        <!-- PDF 多页微调悬浮胶囊（停靠画布底部） -->
        <div id="pdf-bar" class="float-pill float-pill-bottom hidden">
          <div class="quick-group">
            <button id="btn-pdf-prev" class="pill-btn pill-icon-btn" title="上一页">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
            </button>
            <span class="pdf-page-box">
              <input id="inp-pdf-page" type="number" min="1" value="1" class="pdf-page-input" /> / <span id="lbl-pdf-total">1</span>
            </span>
            <button id="btn-pdf-next" class="pill-btn pill-icon-btn" title="下一页">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            </button>
          </div>
          <div class="pill-sep"></div>
          <button id="btn-pdf-pick-text" class="pill-btn pill-btn-active" title="单击无损查看，双击原位改字">原位改字</button>
          <button id="btn-pdf-add-text" class="pill-btn" title="插入文字（也可双击空白处）">填字</button>
          <button id="btn-pdf-add-mask" class="pill-btn" title="添加白色遮盖">遮盖</button>
          <button id="btn-pdf-add-img" class="pill-btn" title="插入本地图片/签名">插图</button>
          <div class="pill-sep"></div>
          <button id="btn-pdf-save-as" class="pill-btn" title="另存为新 PDF">另存</button>
        </div>
      </div>

      <!-- 右侧极简属性 / 图层 / 文件面板 -->
      <aside id="inspector-panel" class="inspector-panel">
        <div class="inspector-tabs">
          <button class="tab-btn active" data-tab="props">属性</button>
          <button class="tab-btn" data-tab="layers">图层</button>
          <button class="tab-btn" data-tab="files">文件</button>
        </div>

        <!-- 属性面板 -->
        <div id="tab-props" class="tab-pane active">
          <!-- 未选中元素时：画布设置 -->
          <div id="props-canvas-section" class="prop-section">
            <div class="prop-block">
              <div class="section-title">画布</div>
              <div class="grid-2">
                <label class="field-inline">
                  <span class="field-prefix">W</span>
                  <input id="inp-canvas-w" type="number" min="100" max="4000" step="10" value="800" />
                </label>
                <label class="field-inline">
                  <span class="field-prefix">H</span>
                  <input id="inp-canvas-h" type="number" min="100" max="6000" step="10" value="800" />
                </label>
              </div>
              <div class="preset-chips">
                <button class="chip-btn" data-size="800x800">800²</button>
                <button class="chip-btn" data-size="900x1200">3:4</button>
                <button class="chip-btn" data-size="750x1200">详情</button>
                <button class="chip-btn" data-size="1080x1440">小红书</button>
                <button class="chip-btn" data-size="1200x628">横幅</button>
              </div>
              <div id="canvas-bg-row" class="field-row">
                <span class="row-label">背景颜色</span>
                <input id="inp-canvas-bg" type="color" class="swatch-inline" value="#ffffff" />
              </div>
            </div>

            <div class="prop-block">
              <div class="section-title">导出</div>
              <div class="grid-2">
                <label class="field">
                  <span>格式</span>
                  <select id="inp-export-format">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                  </select>
                </label>
                <label class="field">
                  <span>倍率</span>
                  <select id="inp-export-scale">
                    <option value="1">1×</option>
                    <option value="2" selected>2×</option>
                    <option value="3">3×</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="prop-block">
              <div class="section-title">文件</div>
              <div class="file-loc-actions">
                <button id="btn-props-reveal-file" class="btn btn-secondary btn-full" disabled>打开文件所在位置</button>
                <button id="btn-props-reveal-export" class="btn btn-secondary btn-full hidden">打开导出图位置</button>
              </div>
            </div>
          </div>

          <!-- 选中元素时：元素属性 -->
          <div id="props-element-section" class="prop-section hidden">
            <div class="prop-block">
              <div class="section-title-row">
                <span id="sel-name-label" class="sel-title">选中元素</span>
                <button id="btn-sel-lock" class="link-btn" title="锁定/解锁">解锁</button>
              </div>

              <!-- 6 向对齐线性图标条 -->
              <div class="align-grid">
                <button class="align-btn" data-align="left" title="左对齐">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="2.5" x2="2.5" y2="13.5"/><rect x="5" y="4.5" width="7.5" height="3" rx="0.8"/><rect x="5" y="9" width="5" height="3" rx="0.8"/></svg>
                </button>
                <button class="align-btn" data-align="center-h" title="水平居中">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="8" y1="2.5" x2="8" y2="13.5"/><rect x="4" y="4.5" width="8" height="3" rx="0.8"/><rect x="5.5" y="9" width="5" height="3" rx="0.8"/></svg>
                </button>
                <button class="align-btn" data-align="right" title="右对齐">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="13.5" y1="2.5" x2="13.5" y2="13.5"/><rect x="3.5" y="4.5" width="7.5" height="3" rx="0.8"/><rect x="6" y="9" width="5" height="3" rx="0.8"/></svg>
                </button>
                <button class="align-btn" data-align="top" title="顶对齐">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="2.5" x2="13.5" y2="2.5"/><rect x="4.5" y="5" width="3" height="7.5" rx="0.8"/><rect x="9" y="5" width="3" height="5" rx="0.8"/></svg>
                </button>
                <button class="align-btn" data-align="center-v" title="垂直居中">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="8" x2="13.5" y2="8"/><rect x="4.5" y="4" width="3" height="8" rx="0.8"/><rect x="9" y="5.5" width="3" height="5" rx="0.8"/></svg>
                </button>
                <button class="align-btn" data-align="bottom" title="底对齐">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="13.5" x2="13.5" y2="13.5"/><rect x="4.5" y="3.5" width="3" height="7.5" rx="0.8"/><rect x="9" y="6" width="3" height="5" rx="0.8"/></svg>
                </button>
              </div>

              <!-- 坐标与尺寸（Figma 内嵌前缀样式） -->
              <div class="grid-2">
                <label class="field-inline"><span class="field-prefix">X</span><input id="inp-x" type="number" step="1" /></label>
                <label class="field-inline"><span class="field-prefix">Y</span><input id="inp-y" type="number" step="1" /></label>
                <label class="field-inline"><span class="field-prefix">W</span><input id="inp-w" type="number" min="4" step="1" /></label>
                <label class="field-inline"><span class="field-prefix">H</span><input id="inp-h" type="number" min="4" step="1" /></label>
              </div>
            </div>

            <!-- 旋转与不透明度 -->
            <div class="prop-block">
              <div class="section-title-row">
                <span class="section-title">旋转</span>
                <button class="link-btn" data-rot="reset">归零 0°</button>
              </div>
              <div class="angle-control">
                <input id="inp-angle-range" type="range" min="-180" max="180" step="0.5" value="0" />
                <input id="inp-angle-num" type="number" min="-180" max="180" step="0.5" value="0" class="angle-num" />
              </div>

              <div class="field-row" style="margin-top:4px;">
                <span class="row-label">不透明度</span>
                <span id="lbl-opacity" class="row-val">100%</span>
              </div>
              <input id="inp-opacity" type="range" min="0" max="100" step="1" value="100" />
            </div>

            <!-- 文本专属属性 -->
            <div id="props-text-group" class="prop-block hidden">
              <div class="section-title">文字</div>
              <textarea id="inp-text" rows="2" class="text-area" placeholder="输入文字内容"></textarea>
              <label class="field">
                <select id="inp-font-family">
                  <option value="&quot;Times New Roman&quot;, SimSun, &quot;Songti SC&quot;, serif">宋体（正文/中英混排）</option>
                  <option value="SimHei, &quot;Heiti SC&quot;, sans-serif">黑体（标题/粗体）</option>
                  <option value="KaiTi, STKaiti, serif">楷体</option>
                  <option value="FangSong, STFangsong, serif">仿宋</option>
                  <option value="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif">微软雅黑 / 等线</option>
                  <option value="Impact, &quot;Arial Black&quot;, sans-serif">Impact</option>
                  <option value="Georgia, &quot;Times New Roman&quot;, serif">Georgia</option>
                </select>
              </label>
              <div class="grid-2">
                <label class="field-inline"><span class="field-prefix">号</span><input id="inp-font-size" type="number" min="6" max="260" step="0.5" /></label>
                <label class="field">
                  <select id="inp-font-weight">
                    <option value="400">常规</option>
                    <option value="600">中粗</option>
                    <option value="700">加粗</option>
                    <option value="800">特粗</option>
                    <option value="900">极粗</option>
                  </select>
                </label>
              </div>
              <div class="align-grid align-3">
                <button class="align-btn" data-text-align="left">左对齐</button>
                <button class="align-btn" data-text-align="center">居中</button>
                <button class="align-btn" data-text-align="right">右对齐</button>
              </div>
            </div>

            <!-- 外观：颜色、圆角与阴影 -->
            <div class="prop-block">
              <div class="section-title">外观</div>
              <div class="color-grid">
                <label class="color-field" id="wrap-fill">
                  <input id="inp-fill" type="color" value="#111827" />
                  <span id="lbl-fill">填充</span>
                </label>
                <label class="color-field" id="wrap-bg">
                  <input id="inp-bg" type="color" value="#ef4444" />
                  <span>背景</span>
                </label>
                <label class="color-field" id="wrap-stroke">
                  <input id="inp-stroke" type="color" value="#000000" />
                  <span>描边</span>
                </label>
              </div>
              <div class="grid-2">
                <label class="field-inline"><span class="field-prefix">边</span><input id="inp-stroke-w" type="number" min="0" max="40" step="1" value="0" /></label>
                <label class="field-inline"><span class="field-prefix">角</span><input id="inp-radius" type="number" min="0" max="200" step="1" value="0" /></label>
              </div>
              <label class="field-row switch-row">
                <span class="row-label">柔和阴影</span>
                <input id="inp-shadow" type="checkbox" class="toggle-switch" />
              </label>
            </div>

            <!-- 层级顺序 -->
            <div class="prop-block">
              <div class="section-title">层级</div>
              <div class="align-grid align-4">
                <button class="align-btn" data-layer="front">置顶</button>
                <button class="align-btn" data-layer="up">上移</button>
                <button class="align-btn" data-layer="down">下移</button>
                <button class="align-btn" data-layer="back">置底</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 图层面板 -->
        <div id="tab-layers" class="tab-pane">
          <div class="section-title-row">
            <span class="section-title">图层</span>
            <span id="layer-count" class="muted-xs">0</span>
          </div>
          <div id="layer-list" class="layer-list"></div>
        </div>

        <!-- 文件浏览面板 -->
        <div id="tab-files" class="tab-pane">
          <div class="path-bar">
            <button id="btn-dir-up" class="icon-btn icon-btn-xs" title="上级目录">↑</button>
            <input id="inp-dir-path" type="text" class="path-input" placeholder="目录或文件路径..." />
            <button id="btn-dir-go" class="btn btn-secondary btn-sm">前往</button>
            <button id="btn-reveal-dir" class="icon-btn icon-btn-xs" title="在资源管理器中打开">
              <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11.5 3.5h5v5M16.5 3.5l-7 7M14.5 11.5v3.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5h3.5"/></svg>
            </button>
          </div>
          <div class="file-action-row">
            <button id="btn-new-design" class="btn btn-secondary btn-sm">新建主图</button>
            <button id="btn-refresh-files" class="btn btn-secondary btn-sm">刷新</button>
          </div>
          <div id="insert-image-banner" class="insert-banner hidden">
            <span>选择图片插入画布</span>
            <button id="btn-cancel-insert" class="link-btn">取消</button>
          </div>
          <div id="files-list" class="files-list"></div>
        </div>
      </aside>
    </div>

    <!-- 极简轻提示 -->
    <div id="toast" class="toast hidden">
      <span id="toast-msg"></span>
      <button id="toast-action" class="toast-action hidden"></button>
    </div>
  </div>

  <script>/*__INLINE_JS__*/</script>
</body>
</html>
